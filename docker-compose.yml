version: '3.9'

services:

  # ---- Ollama (local LLM) ----
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ---- FastAPI backend ----
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: interview-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - chroma_data:/app/db/chroma_store
    depends_on:
      - ollama
    restart: unless-stopped

  # ---- Next.js frontend ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data: